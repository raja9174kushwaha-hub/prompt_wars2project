[project]
name = "electionguide-ai"
version = "1.0.0"
description = "Interactive Election Process Assistant powered by Google Vertex AI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120
